name: Ceyrl application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test private databases, auth, and V6 intelligence
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/v6.js
          node --check static/x.js
          node --check static/studio.js
          node --check static/studio-dashboard.js
          node --check static/aurora.js
          node --check static/experience.js
          node --check static/sale-recap.js
      - name: Compile backend modules
        run: |
          python -m py_compile app.py
          python -m py_compile ceyrl_v6.py
          python -m py_compile ceyrl_shield.py
          python -m py_compile ceyrl_features.py
          python -m py_compile ceyrl_radar.py
          python -m py_compile ceyrl_sports.py
          python -m py_compile ceyrl_ai.py
